# Ported from Palletra scripts/check-wizard-columns-step-roundtrip.sh arm 3 (sweep-3 #3).
# The producer must stamp `SupplierShortlist:` from ScanSuppliers onto the
# IngestSessionPayload literal (so dropping the assignment while keeping the call
# is still caught). One of the five exists-mode anchors split from the .sh.
rules:
  - id: wizard-producer-sets-supplier-candidates
    type: required-pattern
    severity: error
    scope:
      include:
        - "freightworks/services/core-api/internal/stockroom/analyze/scan_session.go"
    preprocess: decomment-go
    params:
      pattern: 'SupplierShortlist:\s*([A-Za-z_][A-Za-z0-9_]*\.)?ScanSuppliers\b'
      mode: exists
    cure: "scan_session.go must assign SupplierShortlist from ScanSuppliers on the IngestSessionPayload literal or the wizard Suppliers step receives a nil slice (sweep-3 #3)."
    origin: scripts/check-wizard-columns-step-roundtrip.sh
