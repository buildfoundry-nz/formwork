# Ported from scripts/check-ratecard-current-rate-reserved.sh (sweep-3 #7).
# message RatedItem must keep `reserved 8;` so a regression cannot re-add
# active_rate at the same wire slot.
# NOTE: the .sh extracts the RatedItem message body (multiline) before checking;
# formwork is line-oriented and scopes to the whole proto file instead. active_rate
# is a RatedItem-specific field name, so cross-message confusion is unlikely; the
# name-reservation + field-redeclaration anchors are the distinctive fingerprint.
rules:
  - id: priced-item-keeps-field-8-reserved
    type: required-pattern
    severity: error
    scope:
      include:
        - 'schema/proto/palletra/domain/v1/rated_item.proto'
    params:
      pattern: 'reserved\s+8\s*;'
      mode: exists
    cure: 'RatedItem must keep `reserved 8;` so active_rate cannot return at the same wire slot (sweep-3 #7).'
    origin: scripts/check-ratecard-current-rate-reserved.sh
