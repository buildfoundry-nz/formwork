name: deploy-hosting
on:
  push:
    branches: [develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web bundle
        run: flutter build web --release --source-maps # want: deploy-source-maps-require-gcs-upload
      - name: Deploy
        run: firebase deploy --only hosting
