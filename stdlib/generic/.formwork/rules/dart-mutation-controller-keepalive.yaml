# Residual: per-method brace analysis → await in bool-build file requires keepAlive.
rules:
- id: dart-mutation-controller-keepalive
  type: forbidden-pattern
  severity: error
  scope:
    include: [packages/*/lib/**/*.dart, frontend/lib/**/*.dart, frontend/admin_app/lib/**/*.dart]
    exclude: ['**/*.g.dart', '**/*.freezed.dart', '**/*.pb.dart']
  params:
    pattern: '\bawait\s+'
    require_present: ['bool\s+build\s*\(']
    # Evidence, not a credential: the keepAlive must sit beside the await it
    # protects. A keepAlive elsewhere in the file protects a different build.
    require_absent:
      - {evidence: 'ref\.keepAlive\s*\(', within: 30}
      - {evidence: 'keepAlive:\s*true', within: 30}
  cure: "final link = ref.keepAlive(); try { await ... } finally { link.close(); } (#6584)."
  origin: stdlib/generic
  tags: [dart]
