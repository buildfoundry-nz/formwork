# Ported from Palletra scripts/check-sku-line-gates-guarded.sh (PH-5 #8147),
# RULE A (authored gate / resolve half). See sku-line-authored-gate-detects
# for the split rationale. This asserts the authored gate (#8229, CreateOriginated)
# references ResolveSkuLineConflict — enforcing the estimator's resolution.
rules:
  - id: sku-line-authored-gate-resolves
    type: required-pattern
    scope:
      include:
        - "freightworks/services/core-api/internal/skuspromote/authored.go"
    preprocess: decomment-go
    params:
      pattern: 'ResolveSkuLineConflict'
      mode: exists
    cure: "The authored sku-line gate must call ResolveSkuLineConflict — enforce the estimator's resolution before creating a line (PH-5 #8147)."
    origin: scripts/check-sku-line-gates-guarded.sh
