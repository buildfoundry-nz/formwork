# Ported from Palletra scripts/check-sku-readers-read-the-entity.sh
# (#2413 PH-4), RULE B (rail reader). The routes/extraction package must contain
# at least one non-test file that calls projectparses.EntitySkus( —
# proving the rail reader resolves a sku's identity from the entity, not by
# re-folding raw sightings. Exists-mode over the package's non-test Go.
rules:
  - id: sku-reader-extraction-reads-entity
    type: required-pattern
    scope:
      include:
        - "freightworks/services/core-api/routes/extraction/**/*.go"
      exclude:
        - "**/*_test.go"
    preprocess: decomment-go
    params:
      pattern: 'projectparses\.EntitySkus\('
      mode: exists
    cure: "The rail reader (routes/extraction) must call projectparses.EntitySkus — resolve identity from the entity, never re-fold (#2413)."
    origin: scripts/check-sku-readers-read-the-entity.sh
