# Ported from Palletra scripts/check-secret-env-names-registered.sh (#2548 secretmask
# env-registry COMPLETENESS). Every secret-shaped string literal
# ([A-Z][A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD|CREDENTIAL|PRIVATE)[A-Z0-9_]*) found
# in non-test Go under freightworks must be EITHER registered as a literal in
# secretVarNames (internal/secretmask/init.go) OR cleared by a
# `// secretmask-allow: NAME reason: <why>` COMMENT.
#
# ESCAPE (type: command). Faithful evaluation needs two string-aware Go lexer
# passes: drop_go_comments (preserves string/rune/raw-literal CONTENTS, drops
# comments) to find the literal set, and prose_only (the INVERSE — emits ONLY
# comment text) so a `secretmask-allow` marker spelled inside a live string
# literal cannot spoof clearance. It then diffs the discovered secret-shaped
# literal set against the registry-literal set AND the comment-only allowlist set
# — a cross-file set relation gated on two opposite comment/string projections
# that no declarative type reproduces. The real script is the faithful check; it
# verifies in CI. No fixture; SKIPs locally (enumerated by lint).
rules:
  - id: secret-env-names-registered
    type: command
    severity: error
    fixture_exempt: >-
      The detector is scripts/check-secret-env-names-registered.sh — the
      validating target's own gate script, which this corpus does not carry
      and cannot: it is written in that tree's vocabulary, and this repository
      tracks no shell scripts at all. In a fixture tree bash would exit 127 in
      the fire tree and the pass tree alike, so the fire proof would be
      satisfied by the detector NOT EXISTING and the pass proof would report
      that same missing-detector exit as a finding. What the port asserts here
      is the SCOPE and the CURE, both readable against the origin script; the
      detection runs where the script does.
    scope:
      include:
        - "freightworks/**/*.go"
      exclude:
        - "**/*_test.go"
    params:
      cmd:
        - bash
        - scripts/check-secret-env-names-registered.sh
      expect:
        exit: 0
    cure: "Add the name as a quoted literal to secretVarNames in internal/secretmask/init.go (a genuine process secret), OR — if a genuine non-secret false positive — clear it with a reviewed `// secretmask-allow: NAME reason: <why>` comment. Never weaken the detection regex."
    origin: scripts/check-secret-env-names-registered.sh
