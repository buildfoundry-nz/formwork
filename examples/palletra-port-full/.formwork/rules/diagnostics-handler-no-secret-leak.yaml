# Ported from Palletra scripts/check-diagnostics-no-credential-leak.sh (#8990).
# The SUPER_ADMIN model-pipeline diagnostics handler must never leak a raw
# credential. Three handler-scoped invariants over the decommented Go source
# of routes/**/diagnostics*.go (comment-stripped so prose mentions are exempt):
#   (1a) no Go struct field NAME ending Key|Secret|Token|Password|Credential|
#        Bearer|PrivateKey (presence flags end Present|Configured|Required and
#        so never match this pattern);
#   (2)  no os.Getenv in the handler (env reads belong in the wiring layer);
#   (3)  no Go error's .Error() interpolated into a response field
#        (Workspace|Bucket|WorkerEndpoint|Queue|Kind) — pgx errors carry conn strings.
# The three handler patterns share one scope + preprocessor, so they are OR'd
# into one forbidden rule; the proto half (different scope, no decomment) is a
# separate rule. The .sh's PAT_GO_OK second-stage filter is inherent here: a
# name ending in a credential token cannot simultaneously end Present/
# Configured/Required, so RE2 needs no lookaround to reproduce it.
rules:
  - id: diagnostics-handler-no-secret-leak
    type: forbidden-pattern
    severity: error
    scope:
      include:
        - "freightworks/services/core-api/routes/**/diagnostics*.go"
      exclude:
        - "**/*_test.go"
    preprocess: decomment-go
    params:
      pattern: '^\s+[A-Z][A-Za-z0-9_]*(Key|Secret|Token|Password|Credential|Bearer|PrivateKey)\s+[A-Za-z]|\bos\.Getenv\(|(Workspace|Bucket|WorkerEndpoint|Queue|Kind):[^,]*\.Error\(\)'
    cure: "Route config via DebugConfig (only *Present/*Configured flags or non-secret identifiers); read env in the wiring layer, not the handler; never interpolate .Error() into a response field. Logs go to slog, not the response body."
    origin: scripts/check-diagnostics-no-credential-leak.sh
