# Ported from Palletra scripts/check-no-raw-tostringasfixed-in-presentation.sh (#8108).
# A bare toStringAsFixed under a Dart .../presentation/... library path is a
# violation unless the file is on the 5-entry presentation allowlist; new
# presentation formatting must use formatCompact/formatDimension from
# plt_core/lib/format. Scope is the presentation subset of the Dart lib roots;
# the allowlist is ported to except.paths.
# Note: the .sh's warn-only stale-allowlist NOTE is a hygiene report, not a
# pass/fail limb, so it is not part of this forbidden-pattern port.
rules:
  - id: no-raw-tostringasfixed-in-presentation
    type: forbidden-pattern
    severity: error
    scope:
      include:
        - "frontend/lib/**/presentation/**/*.dart"
        - "packages/*/lib/**/presentation/**/*.dart"
      exclude:
        - "**/*.g.dart"
        - "**/*.freezed.dart"
        - "**/*.pb*.dart"
    params:
      pattern: 'toStringAsFixed'
    except:
      paths:
        - "packages/feature_costing/lib/presentation/margin/margin_input_slider.dart"
        - "packages/feature_costing/lib/presentation/margin/margin_overview_card.dart"
        - "packages/feature_costing/lib/presentation/margin/margin_drivers_section.dart"
        - "packages/feature_stockroom/lib/presentation/ingest_wizard/ingest_upload_form.dart"
        - "packages/plt_pricing/lib/presentation/lookups/formula_summary_chip.dart"
    cure: "Use formatCompact / formatDimension from packages/plt_core/lib/format/ instead of a bare toStringAsFixed in presentation code (#8108)."
    origin: scripts/check-no-raw-tostringasfixed-in-presentation.sh
