rules:
- id: dart-weak-types-cast-to-weak
  type: forbidden-pattern
  severity: error
  scope:
    include:
    - '**/*.dart'
  params:
    pattern: \bas[[:space:]]+(dynamic|Object\?|Object|Function)\b
  cure: Do not launder a value through a weak top-type cast. Declare the actual class / sealed union, use a Freezed value object, or narrow the wire shape via fromJson before propagating a typed value inward.
  origin: stdlib/generic
  tags:
  - dart
