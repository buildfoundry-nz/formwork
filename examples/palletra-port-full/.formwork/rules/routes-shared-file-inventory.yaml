# Ported from Palletra scripts/check-routes-shared-file-inventory.sh (#2461).
#
# routes/shared was the service's de-facto kernel — a 2k-LOC junk drawer. #2461
# moved the engine-reachable domain into internal/ packages and freezes the
# residue with docs/routes-shared-file-inventory.md. This gate is a shrink-only
# inventory allowlist: EVERY non-test *.go file directly under routes/shared MUST
# be classified (repo-relative path in backticks) in that doc. A NEW unlisted
# file FAILS CI (so a reviewer decides whether it is domain that belongs in
# internal/); a listed-but-absent path warns (stale); a missing doc or absent
# target dir is exit 2 (broken gate).
#
# PORT MAPPING: COMMAND ESCAPE. The load-bearing property is set membership of
# each source file's PATH in an external markdown doc. set-relation builds its
# two string sets from file CONTENT lines (capture groups matched inside files),
# not from the file PATHS themselves, so the A-side "every routes/shared *.go
# path" set cannot be constructed declaratively; doc-path-exists covers only the
# reverse (paths cited in the doc must exist), not the primary "file present but
# unlisted" defect, and neither expresses the exit-2 broken-gate guards. Not
# expressible declaratively, so this is the spec's sanctioned escape: params.cmd
# runs the real check, which verifies in CI. No fixture (formwork lint
# enumerates it).
rules:
  - id: routes-shared-file-inventory
    type: command
    severity: error
    fixture_exempt: >-
      The detector is scripts/check-routes-shared-file-inventory.sh — the
      validating target's own gate script, which this corpus does not carry
      and cannot: it is written in that tree's vocabulary, and this repository
      tracks no shell scripts at all. In a fixture tree bash would exit 127 in
      the fire tree and the pass tree alike, so the fire proof would be
      satisfied by the detector NOT EXISTING and the pass proof would report
      that same missing-detector exit as a finding. What the port asserts here
      is the SCOPE and the CURE, both readable against the origin script; the
      detection runs where the script does.
    scope:
      include:
        - "freightworks/services/core-api/routes/shared/*.go"
        - "docs/routes-shared-file-inventory.md"
    params:
      cmd:
        - bash
        - scripts/check-routes-shared-file-inventory.sh
      expect:
        exit: 0
    cure: "routes/shared is a frozen drawer (#2461). Classify each new file in docs/routes-shared-file-inventory.md (repo-relative path in backticks) as E (HTTP envelope/plumbing), V (routes-only validation), or S (shim forwarder to an internal/ package). If the file is DOMAIN logic an internal/ engine could need, move it to services/core-api/internal/ instead of listing it."
    origin: scripts/check-routes-shared-file-inventory.sh
