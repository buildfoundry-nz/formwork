# Two count-relation arms in one file (the client-portal-gate shape). The first
# is anchored; the second is not. Anchoring is strictly intra-arm, so the first
# arm's `funcs:` must not satisfy the second — a whole-file scan would wave the
# unanchored arm through.
rules:
- id: demo-anchored-arm
  type: go/per-func-count-relation
  severity: error
  scope:
    include: [api-factory/**/*.go]
  params:
    funcs: ^mountClientPortal$
    left: shared\.ClaimsOr401
    right: clientportal\.RequireEnabled
    relation: '<='
  cure: Consult the rollout gate.
  tags: [go]
- id: demo-unanchored-sibling
  type: go/per-func-count-relation
  severity: error
  scope:
    include: [api-factory/**/*.go]
  params:
    left: clientportal\.RequireEnabled
    right: h\.finish
    relation: '<='
  cure: End the handler with h.finish.
  tags: [go]
