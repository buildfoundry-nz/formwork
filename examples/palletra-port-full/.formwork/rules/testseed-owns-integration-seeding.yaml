# Ported from Palletra scripts/check-testseed-owns-integration-seeding.sh
# (#1971, collapsed to a plain ban by #5068). Any freightworks *_test.go carrying a
# raw seed INSERT into palletra.projects or platform.organizations must instead
# seed via freightworks/internal/testseed. The shipped gate matches case-insensitively
# and whitespace-tolerantly with a word boundary after the table name; RE2 gives us
# `(?i)`, `\s+` and `\b` for a faithful port.
# Structural exemptions carried across as scope.exclude: migrations/ (raw SQL is the
# point), routes/ (its own testsupport seeder), gatetests/ (fixtures embed the
# banned INSERT by design), and the one file-exact bulk-seed keep
# pagerefresh/query_speed_integration_test.go.
rules:
  - id: testseed-owns-integration-seeding
    type: forbidden-pattern
    severity: error
    scope:
      include:
        - "freightworks/**/*_test.go"
      exclude:
        - "**/migrations/**"
        - "freightworks/services/core-api/routes/**"
        - "**/gatetests/**"
        - "freightworks/services/core-api/internal/pagerefresh/query_speed_integration_test.go"
    params:
      pattern: '(?i)INSERT\s+INTO\s+(palletra\.projects|platform\.organizations)\b'
    cure: "Seed the org->project->version->page chain via freightworks/internal/testseed (PrimeProjectChain / PrimeProject / PrimeOrgUser), not a raw INSERT (#5068)."
    origin: scripts/check-testseed-owns-integration-seeding.sh
