# formwork 0.13 removed except: (except.paths and except.marker). Any carve-out
# or marker opt-in this port describes below is gone: its home file is judged
# by this rule like every other file.
# Ported from Palletra scripts/check-dart-measure-step-must-use-resolved-provider.sh (forbidden-pattern).
# The Measure rail must read the RESOLVED activeStageCodeProvider, never the raw
# targetStepCode (empty on landing). Bans code-level reads of the raw intent —
# field access `.targetStepCode`, constructor arg `targetStepCode:`, or the
# read-provider `targetStepCodeProvider` — across packages/*/lib, except the
# 8-file allowlist that OWNS the two concepts and their resolution (ported to
# except.paths). Generated Dart is excluded. A comment merely NAMING it is not a
# code read; the .sh matches raw source and so does this rule.
rules:
  - id: dart-measure-step-must-use-resolved-provider
    type: forbidden-pattern
    scope:
      include:
        - "packages/*/lib/**/*.dart"
      exclude:
        - "**/*.g.dart"
        - "**/*.freezed.dart"
    params:
      pattern: '\.targetStepCode\b|\stargetStepCode:|\btargetStepCodeProvider\b'
    cure: "Operational consumers must read activeStageCodeProvider(projectId) (the resolved displayed step), not the raw targetStepCode."
    origin: scripts/check-dart-measure-step-must-use-resolved-provider.sh
