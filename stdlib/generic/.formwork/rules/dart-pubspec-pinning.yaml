rules:
- id: dart-pubspec-pinning
  type: forbidden-pattern
  severity: error
  scope:
    include:
    - '**/pubspec.yaml'
  params:
    pattern: '^\s+(provider|get|redux|flutter_redux|mobx|flutter_bloc|scoped_model):'
  cure: Remove the competing state-manager dependency; the codebase must pick one, and it is Riverpod 3.x (flutter_riverpod ^3.2 / riverpod_annotation ^4). provider/get/redux/flutter_redux/mobx/flutter_bloc/scoped_model conflict with that posture.
  origin: stdlib/generic
  tags:
  - always
