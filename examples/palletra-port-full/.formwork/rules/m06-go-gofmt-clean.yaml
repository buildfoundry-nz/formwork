# Ported from Palletra scripts/check-go-gofmt-clean.sh.
#
# Every hand-written Go file in the repo (all *.go incl. generated *.pb.go and
# shared/generated, excluding only vendor/node_modules and sibling worktrees)
# must be byte-identical to `gofmt` output; a parse error (gofmt non-zero) is
# also a failure. That gate fundamentally shells out to the `gofmt` binary from
# the pinned toolchain and diffs its output against the on-disk bytes — no
# self-contained fixture can reproduce a real formatter's canonical output, so
# it maps to the `command` escape hatch. params.cmd is the real gate, which
# self-locates and runs gofmt -l over the in-scope Go files; expect.exit 0.
rules:
  - id: m06-go-gofmt-clean
    type: command
    severity: error
    fixture_exempt: >-
      The detector is scripts/check-go-gofmt-clean.sh — the validating
      target's own gate script, which this corpus does not carry and cannot:
      it is written in that tree's vocabulary, and this repository tracks no
      shell scripts at all. In a fixture tree bash would exit 127 in the fire
      tree and the pass tree alike, so the fire proof would be satisfied by
      the detector NOT EXISTING and the pass proof would report that same
      missing-detector exit as a finding. What the port asserts here is the
      SCOPE and the CURE, both readable against the origin script; the
      detection runs where the script does.
    scope:
      include:
        - "freightworks/**/*.go"
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
    params:
      cmd:
        - bash
        - scripts/check-go-gofmt-clean.sh
      expect:
        exit: 0
    cure: "gofmt -w <file> (or gofmt -w freightworks). A parse error means the file is not valid Go — fix the syntax. Never add a //nolint escape or widen the exclude list for a real violation."
    origin: scripts/check-go-gofmt-clean.sh
