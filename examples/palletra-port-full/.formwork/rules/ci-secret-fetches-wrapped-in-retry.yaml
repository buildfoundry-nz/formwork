# Ported from Palletra scripts/check-ci-secret-fetches-wrapped-in-retry.sh (#6245).
# Every `gcloud secrets versions access` under scripts/ci/**/*.go MUST be wrapped
# as `retry <n> gcloud secrets versions access …`; a bare fetch fails the whole
# nightly on a transient WIF/STS token reset. The compliant wrapper places a
# digit-then-space immediately before `gcloud` (`retry 5 gcloud …`); the
# forbidden pattern matches a `gcloud secrets versions access` invocation whose
# `gcloud` is at command position — line-start (after indentation) OR preceded by
# a non-digit/non-space char (`$(`, `;`, `=`, etc.) — i.e. NOT the retry wrapper.
# The invocation lives in a Go string literal (a shell fragment exec'd via
# `bash -c`); the command-position anchoring is content-level, so it behaves
# identically inside the literal.
#
# DIVERGENCE (noted): the original .sh was a set-difference (invocation lines
# MINUS the retry-wrapped lines) and dropped shell `#` comment lines. RE2 has no
# lookbehind, so this approximates the wrapper exclusion by command-position
# anchoring, and the comment-line exclusion is not ported (a Go comment
# mentioning the command could false-fire). Fixtures avoid comment-only mentions.
rules:
  - id: ci-secret-fetches-wrapped-in-retry
    type: forbidden-pattern
    severity: error
    scope:
      include:
        - "scripts/ci/**/*.go"
    params:
      pattern: '(^[[:space:]]*|[^0-9[:space:]][[:space:]]*)gcloud[[:space:]]+secrets[[:space:]]+versions[[:space:]]+access'
    cure: "Wrap the fetch — VAL=\"$(retry 5 gcloud secrets versions access latest --secret=… --project=\"$PROJECT\")\". A bare fetch fails the nightly on a transient token reset (#6245)."
    origin: scripts/check-ci-secret-fetches-wrapped-in-retry.sh
