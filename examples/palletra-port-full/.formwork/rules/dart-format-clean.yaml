# Ported from Palletra scripts/check-dart-format-clean.sh (#4904).
#
# Every hand-written .dart file under packages/ + frontend/ must be byte-identical
# to `dart format` output on the repo-PINNED Flutter/Dart toolchain.
# `dart format` output is version-dependent, so the single source of truth is the
# pinned SDK — the gate fundamentally shells out to `dart format` and cannot be
# reproduced as a self-contained text fixture (a formatter is not a regex). It
# maps to the `command` ESCAPE HATCH: params.cmd is the real check script,
# verified in CI where the SDK is present. No fixture; SKIPs locally.
rules:
  - id: dart-format-clean
    type: command
    severity: error
    fixture_exempt: >-
      The detector is scripts/check-dart-format-clean.sh — the validating
      target's own gate script, which this corpus does not carry and cannot:
      it is written in that tree's vocabulary, and this repository tracks no
      shell scripts at all. In a fixture tree bash would exit 127 in the fire
      tree and the pass tree alike, so the fire proof would be satisfied by
      the detector NOT EXISTING and the pass proof would report that same
      missing-detector exit as a finding. What the port asserts here is the
      SCOPE and the CURE, both readable against the origin script; the
      detection runs where the script does.
    scope:
      include:
        - "packages/**/*.dart"
        - "frontend/**/*.dart"
      exclude:
        - "**/generated/**"
        - "**/.dart_tool/**"
        - "**/build/**"
        - "**/*.g.dart"
        - "**/*.freezed.dart"
        - "**/*.pb.dart"
        - "**/*.pbenum.dart"
        - "**/*.pbjson.dart"
        - "**/*.config.dart"
    params:
      cmd:
        - bash
        - scripts/check-dart-format-clean.sh
      expect:
        exit: 0
    cure: "Run 'dart format .' on the repo-pinned Flutter toolchain. NEVER hand-exempt a file or widen the generated-exemption list."
    origin: scripts/check-dart-format-clean.sh
