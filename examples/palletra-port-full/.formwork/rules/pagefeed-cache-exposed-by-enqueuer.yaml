# Ported from Palletra scripts/check-pagefeed-cache-shared.sh (PR #2765 #8).
# Dev-local must run ONE pagefeed.Cache: a composition-root wiring chain no
# unit test can pin. This is link 1 (enqueuer exposes the shared cache). Comment-stripped (decomment-go) so
# prose can never satisfy the link. exists-mode over the exact file.
rules:
  - id: pagefeed-cache-exposed-by-enqueuer
    type: required-pattern
    scope:
      include:
        - "freightworks/services/core-api/extraction_dispatcher.go"
    preprocess: decomment-go
    params:
      pattern: 'PageFeedCache:\s*localDependencies\.PageFeedCache'
      mode: exists
    cure: "the local-enqueuer branch must expose the shared cache (PageFeedCache: localDependencies.PageFeedCache)."
    origin: scripts/check-pagefeed-cache-shared.sh
