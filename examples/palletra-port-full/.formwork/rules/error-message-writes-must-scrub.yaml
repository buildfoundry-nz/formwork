# Ported from Palletra scripts/check-error-message-writes-must-scrub.sh (#2548 /
# Task 7b-fix) — sink-side secret-redaction completeness. Every TOP-LEVEL Go
# func in freightworks that WRITES the error_message column must call
# secretmask.Scrub( within its OWN body, unless the whole file is allowlisted
# as a static-literal-only writer. A writer is classified PER top-level func by:
#   W1 — an UPDATE SET-clause `error_message =` that is not a bare `= NULL` clear
#        (SET-vs-WHERE phase tracked over the SQL projection, parenthesis-depth
#        aware so a subquery WHERE does not end the SET clause), or
#   W2 — `error_message` inside an `INSERT INTO palletra.<table>` column list.
#
# ESCAPE (type: command). This gate is a per-top-level-func SQL-semantic
# analysis: it runs a string-aware Go lexer (three fused state machines) to strip
# comments, blank string interiors, and build an SQL-only projection, then walks
# that projection char-by-char tracking SET/WHERE phase and paren depth to
# decide W1, tracks INSERT column-list membership cumulatively for W2, and scopes
# the required secretmask.Scrub( presence to the enclosing `^func` window. No
# declarative type (or even the go/* analyzers) reproduces the func-scoped
# SQL-phase writer classification with the file-level allowlist. The real script
# is the faithful check; it verifies in CI.
rules:
  - id: error-message-writes-must-scrub
    type: command
    severity: error
    fixture_exempt: >-
      The detector is scripts/check-error-message-writes-must-scrub.sh — the
      validating target's own gate script, which this corpus does not carry
      and cannot: it is written in that tree's vocabulary, and this repository
      tracks no shell scripts at all. In a fixture tree bash would exit 127 in
      the fire tree and the pass tree alike, so the fire proof would be
      satisfied by the detector NOT EXISTING and the pass proof would report
      that same missing-detector exit as a finding. What the port asserts here
      is the SCOPE and the CURE, both readable against the origin script; the
      detection runs where the script does.
    scope:
      include:
        - "freightworks/**/*.go"
      exclude:
        - "**/*_test.go"
        - "**/*.pb.go"
        - "**/vendor/**"
        - "**/generated/**"
    params:
      cmd:
        - "bash"
        - "scripts/check-error-message-writes-must-scrub.sh"
      expect:
        exit: 0
    cure: "Route the value through secretmask.Scrub(...) before binding it as a query parameter, inside the SAME top-level func (see internal/skuextract/write.go or internal/pageraster/persist_error.go). If it is a genuinely static-literal-only write, add the FILE to the ALLOWLIST in the script with a one-line WHY."
    origin: scripts/check-error-message-writes-must-scrub.sh
