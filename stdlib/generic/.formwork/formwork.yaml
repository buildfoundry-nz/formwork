version: 1

# This corpus is the generic pack. It does not set `library:` — the rules
# here ARE the pack, proven by `formwork test -C stdlib/generic`.
lanes:
  ci:
    all: true
    ci: true

# Test code, for the rules whose subject is production code
# (scope.subject: production). Every other rule reads tests.
tests:
  - "**/*_test.go"
  - "**/*_test.dart"
