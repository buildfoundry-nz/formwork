name: CI
on: [push, pull_request]
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - run: echo classify
  integration:
    if: ${{ needs.scope.outputs.go_touched == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: routes log-before-500 gate
        run: bash scripts/check-routes-log-pre-500.sh
