# Ported from Palletra scripts/check-single-writer-pagefeed-existence.sh
# (sweep-1 #3, link 4). The split gate must not revert to a bare `return true,
# nil` on the Size probe — the divergent shape that treated a 0-byte object as
# present. Comment-stripped in the .sh; decomment-go is the faithful port.
rules:
  - id: pagefeed-single-writer-no-bare-return-true
    type: forbidden-pattern
    severity: error
    scope:
      include:
        - "freightworks/services/core-api/internal/pdfcarve/worker_wiring.go"
    preprocess: decomment-go
    params:
      pattern: 'return true, nil'
    cure: "pdfcarve.hasOutput must route presence through pagefeed.AssetPresent(size), never a bare 'return true, nil' on a successful Size probe (sweep-1 #3)."
    origin: scripts/check-single-writer-pagefeed-existence.sh
