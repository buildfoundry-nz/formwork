# Ported from Palletra scripts/check-no-1password-or-op-secret-references.sh (plan item #10).
# The .sh is a 4-rule bundle. This rule ports Rule 1 — the headline structural
# ban: no 1Password `op://` secret-reference URI and no `1password/`-action use
# anywhere in the repo outside docs/ (Google Secret Manager / WIF is the only
# sanctioned secret source). Rules 2 (secret-shaped env_raw_value read in
# scripts/), 3 (a Go secret read paired with a committed literal default — needs
# a multi-line backreference, not RE2-expressible) and 4 (a repo secret mapped
# into a secret-shaped workflow name, with a github.token carve-out) are NOT
# folded into this single line-oriented pattern; see notes.
#
# FP FIX (was: fired 12× on scripts/check-no-1password-or-op-secret-references.sh — the gate's
# OWN pattern table). The .sh globs itself out (`-g '!**/check-no-1password-or-op-secret-references.sh'`)
# and .git/** so it never flags its own `op://` / `1password/` literals; the
# port excluded only docs/ + gatetests, so the self-script's pattern
# strings matched. The self-script (and .git/**) are now scope.excluded, exactly
# the .sh's own self-reference carve-out. A real op:// / 1password/ anywhere
# else outside docs/ still fires.
rules:
  - id: no-1password-or-op-secret-references
    type: forbidden-pattern
    severity: error
    scope:
      include:
        - "**"
      exclude:
        - "docs/**"
        - "**/internal/gatetests/**"
        - "**/check-no-1password-or-op-secret-references.sh"
        - "**/.git/**"
    params:
      pattern: 'op://|1password/'
    cure: "Secrets come from Google Secret Manager (impersonate the runtime SA) or a Cloud Run secret ref injected by the infra repo — never op:// or a 1password/load-secrets-action."
    origin: scripts/check-no-1password-or-op-secret-references.sh
