# Ported from Palletra scripts/check-page-metric-version-single-source.sh
# (#2524) Rule B. The extraction-worker (cmd/extraction-worker + internal/workerharness)
# resolves its DerivationVersion default THROUGH parsewrite.DefaultAnalysisVersion,
# never from a bare string literal. A `DerivationVersion = "..."` assignment in
# those two trees is a re-hardcoded default. Comment-stripped (decomment-go).
rules:
  - id: page-metric-worker-computation-version-not-hardcoded
    type: forbidden-pattern
    severity: error
    scope:
      include:
        - "freightworks/services/core-api/cmd/extraction-worker/**/*.go"
        - "freightworks/services/core-api/internal/workerharness/**/*.go"
      exclude:
        - "**/*_test.go"
    preprocess: decomment-go
    params:
      pattern: 'DerivationVersion\s*=\s*"'
    cure: "Reference the single source: parsewrite.DefaultAnalysisVersion."
    origin: scripts/check-page-metric-version-single-source.sh
