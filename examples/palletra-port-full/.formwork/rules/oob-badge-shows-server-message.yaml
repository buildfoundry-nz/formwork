# Ported from Palletra scripts/check-flutter-out-of-bounds-badge-server-owned.sh
# (#2229 / #2074 / #5661), Rule B2 (message half). off_page_badge.dart must
# render the server out-of-bounds copy verbatim. The .sh greps this exact file
# for `outOfGauge.message`; exists-mode over that one file is the faithful port.
# (The companion rule oob-badge-wrapped-in-tooltip covers the "inside a Tooltip" half.)
rules:
  - id: oob-badge-shows-server-message
    type: required-pattern
    severity: error
    scope:
      include:
        - "packages/feature_dimension/lib/presentation/off_page_badge.dart"
    preprocess: code-only-dart
    params:
      pattern: 'outOfGauge\.message'
      mode: exists
    cure: "off_page_badge.dart must render `outOfGauge.message` verbatim or the server out-of-bounds copy has no display site (#2074/#5661)."
    origin: scripts/check-flutter-out-of-bounds-badge-server-owned.sh
