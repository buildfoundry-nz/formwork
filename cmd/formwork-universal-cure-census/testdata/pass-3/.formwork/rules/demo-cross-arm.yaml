# Cross-arm locality (the api-factory-cmd-lifecycle-class shape): one arm is
# existential with an honest singular cure; a SECOND arm, more than ten lines
# below, carries the universal word. A whole-file co-occurrence would fire
# here; the windowed one must not, because no single ARM pairs the two.
rules:
- id: demo-cross-arm-exists
  type: required-pattern
  severity: error
  scope:
    include: [api-factory/cmd/**/main.go]
  params:
    pattern: func main\(
    mode: exists
  cure: 'The cmd entry point must declare func main.'
  tags: [go]

- id: demo-cross-arm-universal
  type: required-pattern
  severity: error
  scope:
    include: [api-factory/cmd/**/main.go]
  params:
    pattern: ReadmeRow\(
    mode: every-file
  cure: Every cmd dir must appear in the README index and every index row must name a lifecycle class.
  tags: [go]
