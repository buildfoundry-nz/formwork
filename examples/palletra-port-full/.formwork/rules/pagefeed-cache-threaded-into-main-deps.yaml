# Ported from Palletra scripts/check-pagefeed-cache-shared.sh (PR #2765 #8).
# Dev-local must run ONE pagefeed.Cache: a composition-root wiring chain no
# unit test can pin. This is link 2 (main.go threads the cache into CoreRouteDeps). Comment-stripped (decomment-go) so
# prose can never satisfy the link. exists-mode over the exact file.
rules:
  - id: pagefeed-cache-threaded-into-main-deps
    type: required-pattern
    scope:
      include:
        - "freightworks/services/core-api/main.go"
    preprocess: decomment-go
    params:
      pattern: 'PageFeedCache:\s*extractionDispatcher\.PageFeedCache'
      mode: exists
    cure: "main.go must thread the enqueuer's shared cache into CoreRouteDeps (PageFeedCache: extractionDispatcher.PageFeedCache)."
    origin: scripts/check-pagefeed-cache-shared.sh
