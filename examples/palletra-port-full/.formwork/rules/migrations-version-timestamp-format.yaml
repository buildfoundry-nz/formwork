# Ported from Palletra scripts/check-migrations-version-timestamp-format.sh (TS-VER).
# FP FIX: the ported require_match accepted ONLY a 14-digit UTC timestamp prefix,
# so it fired on every FROZEN sequential-history migration the .sh explicitly
# grandfathers — files whose numeric prefix is at/below the per-domain high-water
# mark (palletra 0112, platform 0032) are the immutable sequential history and
# pass untouched. The .sh's grandfather is a NUMERIC comparison; because the
# frozen ranges are FIXED and finite (exactly as hard-coded as the .sh's marks),
# they port faithfully as an RE2 alternation:
#   palletra legacy 0001-0112 -> 00[0-9][0-9] | 01(0[0-9]|1[0-2])
#   platform  legacy 0001-0032 -> 00(0[0-9]|[12][0-9]|3[0-2])
#   any new file (either domain) -> a 14-digit date-plausible timestamp.
# A NEW above-frontier 4-digit sequential (the 0113 fixture / the doc §107 shape)
# matches none of these -> still fires; an implausible 14-digit prefix
# (20009999999999) also fails the timestamp branch and fires.
rules:
  - id: migrations-version-timestamp-format
    type: file-naming
    severity: error
    scope:
      include:
        - "freightworks/services/core-api/migrations/palletra/**/*.up.sql"
        - "freightworks/services/core-api/migrations/palletra/**/*.down.sql"
        - "freightworks/services/core-api/migrations/platform/**/*.up.sql"
        - "freightworks/services/core-api/migrations/platform/**/*.down.sql"
    params:
      require_match: 'migrations/(?:palletra/(?:00[0-9][0-9]|01(?:0[0-9]|1[0-2])|[0-9]{4}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])(?:[01][0-9]|2[0-3])[0-5][0-9][0-5][0-9])|platform/(?:00(?:0[0-9]|[12][0-9]|3[0-2])|[0-9]{4}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])(?:[01][0-9]|2[0-3])[0-5][0-9][0-5][0-9]))_[^/]*\.(?:up|down)\.sql$'
    cure: "Mint new migrations with the minter, never a sequential number or a hand-typed timestamp: scripts/new-migration.sh <palletra|platform> <slug_name>. A 14-digit UTC timestamp version makes parallel migration PRs collision-proof (the doc §107 develop-brick). Sequential history at/below the high-water marks (palletra 0112, platform 0032) is immutable and grandfathered."
    origin: scripts/check-migrations-version-timestamp-format.sh
