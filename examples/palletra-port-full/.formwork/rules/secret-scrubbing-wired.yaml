# Ported from Palletra scripts/check-secret-scrubbing-wired.sh (#2548 sink-scrub
# INSTALL-ANCHOR gate). Five FIXED structural install sites must stay wired:
# within a NAMED top-level func in a NAMED file, a construction/call token must
# appear in that func's OWN body — R1 logging.go func Init → <alias>.Init(,
# R2 logging.go func wireTo → redactWriter{, R3 otelinit.go func Setup →
# redactExporter{, R4 phasefeed/writer.go func (w *Writer) WriteErrored →
# <alias>.Scrub(, R5 parsewrite/persist_stage_activity.go func
# writeStageDone → <alias>.RedactBytes(. A missing FILE, missing FUNC, or
# missing IN-FUNCTION token is a FAIL.
#
# ESCAPE (type: command). Direct sibling of the error-message-writes-must-scrub gate: a
# per-top-level-func analysis on comment- AND string-literal-stripped Go, with a
# column-0 `^func ` window boundary, plus each file's own resolved secretmask
# import ALIAS substituted into the expected token before matching. No
# declarative type — nor the go/* analyzers — reproduces the alias-resolved,
# func-window-scoped token presence across five distinct fixed anchors. The real
# script is the faithful check; it verifies in CI. No fixture; SKIPs locally
# (enumerated by lint).
rules:
  - id: secret-scrubbing-wired
    type: command
    severity: error
    fixture_exempt: >-
      The detector is scripts/check-secret-scrubbing-wired.sh — the validating
      target's own gate script, which this corpus does not carry and cannot:
      it is written in that tree's vocabulary, and this repository tracks no
      shell scripts at all. In a fixture tree bash would exit 127 in the fire
      tree and the pass tree alike, so the fire proof would be satisfied by
      the detector NOT EXISTING and the pass proof would report that same
      missing-detector exit as a finding. What the port asserts here is the
      SCOPE and the CURE, both readable against the origin script; the
      detection runs where the script does.
    scope:
      include:
        - "freightworks/internal/logging/logging.go"
        - "freightworks/services/core-api/internal/otelinit/otelinit.go"
        - "freightworks/services/core-api/internal/phasefeed/writer.go"
        - "freightworks/services/core-api/internal/parsewrite/persist_stage_activity.go"
    params:
      cmd:
        - bash
        - scripts/check-secret-scrubbing-wired.sh
      expect:
        exit: 0
    cure: "Restore the missing anchor WITHIN its named function's OWN body (see the script header for the Task 4/5/6/9 install site each of R1-R5 guards) — a reference in a different function, dead code, or a callee's own definition does not count."
    origin: scripts/check-secret-scrubbing-wired.sh
