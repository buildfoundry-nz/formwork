# Ported from Palletra scripts/check-diagnostics-no-credential-leak.sh (#8990),
# rule 1b: the diagnostics proto contract must not declare a scalar field whose
# NAME carries a credential shape (…api_key|secret|token|password|credential|
# bearer|private_key). Case-insensitive, matched flat in the versioned package
# dir (buf convention, depth 1). No decomment preprocessor: proto shares Go
# comment syntax but formwork ships no decomment-proto; the pattern is anchored
# on a field-declaration shape (…= <n>;) so a // prose mention cannot match.
# The .sh's allowed *_present/_configured/_required forms are inherent: a name
# ending in a credential token cannot also end in a presence token.
rules:
  - id: diagnostics-proto-no-credential-field
    type: forbidden-pattern
    severity: error
    scope:
      include:
        - "schema/proto/palletra/api/v1/diagnostics*.proto"
    params:
      pattern: '(?i)^\s+(bool|string|int32|int64|repeated\s+[a-z0-9_]+)\s+[a-z0-9_]*(api_key|secret|token|password|credential|bearer|private_key)\s*=\s*[0-9]+;'
    cure: "Rename the proto field to a presence shape (*_present / *_configured) or a non-secret identifier; a diagnostics response carries booleans + non-secret ids only."
    origin: scripts/check-diagnostics-no-credential-leak.sh
