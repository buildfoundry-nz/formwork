rules:
  - id: dart-format-clean
    type: command
    severity: error
    scope:
      include:
        - "**/*.dart"
    params:
      cmd: [dart, format, --output=none, --set-exit-if-changed, .]
      when:
        paths_changed: ["**/*.dart"]
      expect:
        exit: 0
    cure: "dart format the listed files."
    origin: stdlib/generic
    tags: [dart]
    fixture_exempt: "requires the dart SDK on PATH; pack CI is Go-only"
